<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">M Rohan Pradev portfolio preview</title>
  <desc id="desc">Senior full-stack engineer focused on architecture, delivery systems, and performance-minded product experiences.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffaf2" />
      <stop offset="60%" stop-color="#f8f2e8" />
      <stop offset="100%" stop-color="#efe4d0" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <g opacity="0.9">
