    <path d="M822 152h64" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <path d="M854 120v64" stroke="#ffffff" stroke-width="10" stroke-linecap="round" />
    <rect x="706" y="286" width="246" height="96" rx="24" fill="rgba(15,23,42,0.92)" />
