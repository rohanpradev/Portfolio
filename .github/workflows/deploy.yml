name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Resolve deployment environment
        shell: bash
        env:
          INPUT_PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          INPUT_PUBLIC_BASE_PATH: ${{ vars.PUBLIC_BASE_PATH }}
          INPUT_PUBLIC_RESUME_URL: ${{ vars.PUBLIC_RESUME_URL }}
        run: |
          strip_outer_quotes() {
            local value="$1"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            if [[ "$value" =~ ^\".*\"$ ]] || [[ "$value" =~ ^\'.*\'$ ]]; then
              value="${value:1:${#value}-2}"
            fi
            printf '%s' "$value"
          }

          SITE_URL="$(strip_outer_quotes "${INPUT_PUBLIC_SITE_URL:-}")"
          BASE_PATH="$(strip_outer_quotes "${INPUT_PUBLIC_BASE_PATH:-}")"
          RESUME_URL="$(strip_outer_quotes "${INPUT_PUBLIC_RESUME_URL:-}")"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          if [ -z "$SITE_URL" ]; then
            SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          elif [[ ! "$SITE_URL" =~ ^[a-zA-Z][a-zA-Z0-9+.-]*:// ]]; then
            SITE_URL="https://${SITE_URL}"
          fi

          SITE_URL="${SITE_URL%/}"

          if [ -z "$BASE_PATH" ] && [ "$REPO_NAME" != "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            BASE_PATH="/$REPO_NAME"
          fi

          if [ -n "$BASE_PATH" ] && [ "${BASE_PATH:0:1}" != "/" ]; then
            BASE_PATH="/$BASE_PATH"
          fi

          echo "PUBLIC_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
          echo "PUBLIC_BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"

          if [ -n "$RESUME_URL" ]; then
            echo "PUBLIC_RESUME_URL=$RESUME_URL" >> "$GITHUB_ENV"
          fi

          echo "Resolved PUBLIC_SITE_URL=$SITE_URL"
          echo "Resolved PUBLIC_BASE_PATH=${BASE_PATH:-<empty>}"

      - name: Install dependencies
        run: bun ci

      - name: Check and build site
        run: bun run ci

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
